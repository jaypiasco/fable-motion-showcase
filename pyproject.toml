[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-motion"
version = "1.0.0"
description = "Fault-tolerant multimodal AI video pipeline orchestrating Gemini, Imagen, and Veo with deterministic state recovery and automated evals."
readme = "README.md"
authors = [
    { name = "John Paul D. Elias", email = "johnpaul.elias101@gmail.com" }
]
license = "Proprietary"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = [
    "ai-video",
    "generative-ai",
    "gemini",
    "veo",
    "imagen",
    "multimodal-pipeline",
    "state-machine",
    "llmops",
    "langfuse"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "gTTS>=2.5.0",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "supabase>=2.3.0",
    "pyjwt>=2.8.0",
    "cryptography>=42.0.0",
    "python-multipart>=0.0.9",
    "google-cloud-storage>=2.14.0",
    "google-genai>=2.22.0",
    "httpx>=0.27.0",
    "prometheus-client>=0.20.0",
    "langfuse>=4.15.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "build>=1.1.0",
    "twine>=5.0.0",
    "ruff>=0.3.0"
]

[project.scripts]
fable-motion = "orchestrator:main"
fable-server = "server:main"
fable-evals = "evals.run_evals:main"

[project.urls]
Homepage = "https://fablemotion.me"
Repository = "https://github.com/jaypiasco/fable-motion"
Documentation = "https://github.com/jaypiasco/fable-motion/blob/main/README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["api*", "core*", "monitoring*", "phases*", "pipeline*", "prompts*", "queue*", "services*", "state*", "evals*"]
exclude = ["tests*", "temp*", "scratch*", "archive*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    "node_modules",
    "temp",
    "scratch",
    "archive",
    "__pycache__"
]
