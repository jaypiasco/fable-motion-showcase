[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = .
asyncio_mode = auto
addopts = -v --tb=short --strict-markers
markers =
    unit: Fast in-memory unit tests
    integration: Integration tests with state, cloud fallbacks, or APIs
    eval: Automated model evaluation and regression tests
